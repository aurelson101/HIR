<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>{{ReportName}}</title>
  <style>
    body { font-family: Segoe UI, Arial, sans-serif; margin: 24px; color: #1f2933; }
    h1 { margin-bottom: 4px; }
    .metadata { margin: 0 0 20px 0; color: #52606d; }
    table { border-collapse: collapse; width: 100%; font-size: 13px; }
    th { background: #102a43; color: #ffffff; text-align: left; }
    th, td { border: 1px solid #d9e2ec; padding: 7px 9px; vertical-align: top; }
    tr:nth-child(even) { background: #f8fafc; }
  </style>
</head>
<body>
  <h1>{{ReportName}}</h1>
  <p class="metadata">Execution date: {{ExecutionDate}} | Result count: {{ResultCount}}</p>
  {{Table}}
</body>
</html>
