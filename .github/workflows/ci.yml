name: HIR validation

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  windows-validation:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install quality modules
        shell: powershell
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
      - name: Analyze PowerShell
        shell: powershell
        run: |
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $issues | Format-Table
          if ($issues) { throw "PSScriptAnalyzer found $($issues.Count) error(s)." }
      - name: Run Pester
        shell: powershell
        run: Invoke-Pester -Path ./Tests -CI
      - name: Validate project and WPF
        shell: powershell
        run: ./Tools/Test-HIRProject.ps1
      - name: Build unsigned package
        shell: powershell
        run: ./Tools/Build-HIRPackage.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HIR-package
          path: Dist/*.zip
